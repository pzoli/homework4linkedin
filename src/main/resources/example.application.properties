spring.application.name=homework4linkedin

# Ne írd a valódi titkot verziókezelt fájlba. Indításkor add meg környezeti
# változóként vagy parancssori paraméterként, pl. --linkedin.client-id=... .
linkedin.client-id=${LINKEDIN_CLIENT_ID:}
linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}
# Ennek karakterre pontosan egyeznie kell a LinkedIn Developer Portalban beállított redirect URL-lel.
linkedin.redirect-uri=http://localhost:8080/api/linkedin/callback
linkedin.api-version=${LINKEDIN_API_VERSION:202608}

# Swagger UI: http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs
